  # Add more companies as needed

# ─── Smart Job Filters (used by AI) ────────────────────────────────────────
filters:
  # Experience levels – OR match (most important, 50% weight)
  experience_levels:
    - "Fresher"
    - "Junior"
    # - "Mid-level"
    # - "Senior"

  # Technology groups – must match at least one from each group (AND between groups)
  technology_groups:
    - ["C++", "C","Java"]          # group 1 – at least one
    # - ["programming", "Spring"]             # group 2 – at least one

  # Recency: AI will consider this, but it is NOT a hard filter
  max_days_old: 5

  # Minimum score (0–100) to be notified
  min_confidence_score: 70

# ─── Scraper Settings (hard‑coded pre‑filters) ────────────────────────────
# ─── Scraper Settings ────────────────────────────────────────────────────────
scraper:
  jobs_per_page: 20
  max_pages_per_company: 10
  request_timeout_seconds: 30
  delay_between_pages: 1
  delay_between_companies: 0.2
  enable_prefilter: true
  # Pre-filters: job MUST contain these (INCLUDE) AND NOT contain these (EXCLUDE)
  pre_filters:
    # 1. Location filter (INCLUDE)
    - field: location
      operator: contains_any
      values: ["India", "Remote", "Hybrid", "Onsite","Bengaluru", "Hyderabad", "Chennai", "Mumbai", "Delhi NCR", "Pune", "Kolkata", "Ahmedabad", "Kochi", "Thiruvananthapuram", "Coimbatore", "Indore", "Jaipur", "Bhubaneswar", "Warangal", "Nagpur", "Udaipur" , "Mysuru" , "IND" , "Karnataka"]
    
    # 2. Title filter - MUST contain these (INCLUDE)
    - field: title
      operator: contains_any
      values: ["Software", "Java", "C++", "SDE", "SWE", "AMTS", "MTS"]
    
    # 3. Skip filter - MUST NOT contain these (EXCLUDE) - ALL SKIP WORDS HERE
    - field: title
      operator: contains_none
      values:
        # Seniority
        - "Senior"
        - "Sr"
        - "Lead"
        - "Manager"
        - "Principal"
        - "Staff"
        - "Architect"
        - "Director"
        - "VP"
        - "Head"
        - "Chief"
        - "Executive"
        - "Fellow"
        - "Distinguished"
        - "President"
        - "Chairman"
        - "Board"
        - "Trustee"
        - "Partner"
        - "Founder"
        # Finance & Accounting
        - "Accountant"
        - "Accounting"
        - "Auditor"
        - "Tax"
        - "Finance"
        - "Financial"
        # Legal & HR
        - "Legal"
        - "Counsel"
        - "Attorney"
        - "HR"
        - "Human Resources"
        - "Recruiting"
        - "Recruitment"
        - "Talent"
        - "People"
        # Business & Sales
        - "Business"
        - "Operations"
        - "Strategy"
        - "Marketing"
        - "Sales"
        - "Account Executive"
        - "Customer Success"
        # Support
