# ─── Scheduler Settings ──────────────────────────────────────────────────────
scheduler:
  interval_minutes: 30
  run_on_startup: true
  max_instances: 1

# ─── Notifications ───────────────────────────────────────────────────────────
notifications:
  telegram:
    enabled: true
  email:
    enabled: false
    smtp_server: "smtp.gmail.com"
    smtp_port: 587
    sender_email: "vinayborate2003@gmail.com"
    recipient_email: "vinayborate11@gmail.com"

# ─── AI Settings ─────────────────────────────────────────────────────────────
ai:
  enabled: false                    # Set to true to use AI, false to skip AI
  model: "gemma3:4b"
  base_url: "http://localhost:11434"
  timeout_seconds: 400

# ─── Logging ─────────────────────────────────────────────────────────────────
logging:
  level: "INFO"
  log_to_file: true
  log_file: "logs/notifier.log"
  rotate_size: "10 MB"
  keep_days: 7